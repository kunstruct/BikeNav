name: Android releases
on:
  push:
    branches:
      - main
      - drakknightmc/strava-biking
    paths:
      - 'android-tracker/**'
      - 'android-helper/**'
      - 'tools/build_tracker.sh'
      - '.github/workflows/android-release.yml'
      - 'scripts/fenfa_publish.py'
      - 'scripts/verify_apk.py'
permissions:
  contents: read
concurrency:
  group: bikenav-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tracker:
    if: github.repository == 'kunstruct/BikeNav' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/drakknightmc/strava-biking') && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint tracker with its existing debug key
        env:
          FENFA_TRACKER_KEYSTORE_B64: ${{ secrets.FENFA_TRACKER_KEYSTORE_B64 }}
          ANDROID_USER_HOME: ${{ runner.temp }}/tracker-android
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ANDROID_USER_HOME"
          test ! -e "$ANDROID_USER_HOME/debug.keystore"
          trap 'rm -f "$ANDROID_USER_HOME/debug.keystore"' EXIT
          printf '%s' "$FENFA_TRACKER_KEYSTORE_B64" | base64 --decode > "$ANDROID_USER_HOME/debug.keystore"
          test -s "$ANDROID_USER_HOME/debug.keystore"
          unset FENFA_TRACKER_KEYSTORE_B64
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          bash tools/build_tracker.sh
      - name: Verify tracker package and signer
        id: apk
        run: python3 scripts/verify_apk.py release-artifacts/RideTracker.apk com.kunstruct.ridetracker 873e1e0bb186a71a1f51df2b5cd0534d850036a57159f0c471660db4ed97ebcd
      - name: Publish tracker
        env:
          FENFA_UPLOAD_URL: https://releases-upload.kunstruct.in/upload
          FENFA_UPLOAD_TOKEN: ${{ secrets.FENFA_UPLOAD_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          FENFA_VARIANT_ID: ${{ vars.FENFA_TRACKER_VARIANT_ID }}
          VERSION: ${{ steps.apk.outputs.version }}
          BUILD: ${{ steps.apk.outputs.build }}
        run: python3 scripts/fenfa_publish.py release-artifacts/RideTracker.apk --variant "$FENFA_VARIANT_ID" --version "$VERSION" --build "$BUILD"
  helper:
    if: github.repository == 'kunstruct/BikeNav' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/drakknightmc/strava-biking') && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint helper with its existing release key
        env:
          BIKENAV_HELPER_KEYSTORE_B64: ${{ secrets.BIKENAV_HELPER_KEYSTORE_B64 }}
          BIKENAV_KEYSTORE: ${{ runner.temp }}/bikenav-helper.jks
          BIKENAV_STORE_PASSWORD: ${{ secrets.BIKENAV_STORE_PASSWORD }}
          BIKENAV_KEY_PASSWORD: ${{ secrets.BIKENAV_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$BIKENAV_KEYSTORE"' EXIT
          printf '%s' "$BIKENAV_HELPER_KEYSTORE_B64" | base64 --decode > "$BIKENAV_KEYSTORE"
          test -s "$BIKENAV_KEYSTORE"
          test -n "$BIKENAV_STORE_PASSWORD" && test -n "$BIKENAV_KEY_PASSWORD"
          unset BIKENAV_HELPER_KEYSTORE_B64
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          cd android-helper
          ./gradlew --no-daemon assembleRelease lintRelease
      - name: Verify helper package and signer
        id: apk
        run: python3 scripts/verify_apk.py android-helper/app/build/outputs/apk/release/app-release.apk com.kunstruct.bikenavhelper 792d7cf32f982c3d5a98f9142110abd6ccf12ed1609decca756c33971832a07a
      - name: Publish helper
        env:
          FENFA_UPLOAD_URL: https://releases-upload.kunstruct.in/upload
          FENFA_UPLOAD_TOKEN: ${{ secrets.FENFA_UPLOAD_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          FENFA_VARIANT_ID: ${{ vars.FENFA_HELPER_VARIANT_ID }}
          VERSION: ${{ steps.apk.outputs.version }}
          BUILD: ${{ steps.apk.outputs.build }}
        run: python3 scripts/fenfa_publish.py android-helper/app/build/outputs/apk/release/app-release.apk --variant "$FENFA_VARIANT_ID" --version "$VERSION" --build "$BUILD"
