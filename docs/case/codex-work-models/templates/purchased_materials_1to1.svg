<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><text x="10" y="12" font-family="sans-serif" font-size="5">BikeNav / purchased material cut templates</text><text x="10" y="19" font-family="sans-serif" font-size="3">Print at 100% / actual size. Verify the 50 mm scale before cutting.</text><text x="10" y="29" font-family="sans-serif" font-size="3">PET transparent film: 68 x 52.4 x 0.20 mm, R1</text><rect x="10" y="34" width="68" height="52.4" rx="1" fill="none" stroke="#000" stroke-width="0.15"/><text x="100" y="29" font-family="sans-serif" font-size="3">Window adhesive: continuous ring</text><rect x="100" y="34" width="68" height="52.4" rx="1" fill="none" stroke="#000" stroke-width="0.15"/><rect x="103.3" y="36.7" width="61.4" height="47" rx="1" fill="none" stroke="#000" stroke-width="0.15"/><text x="100" y="90" font-family="sans-serif" font-size="3">0.15 mm adhesive; 3.3 mm / 2.7 mm lands</text><text x="10" y="105" font-family="sans-serif" font-size="3">Seam gasket: 82.4 x 60.4 / 79.2 x 57.2, R5.2 / R3.6</text><rect x="10" y="110" width="82.4" height="60.4" rx="5.2" fill="none" stroke="#000" stroke-width="0.15"/><rect x="11.6" y="111.6" width="79.2" height="57.2" rx="3.6" fill="none" stroke="#000" stroke-width="0.15"/><text x="10" y="177" font-family="sans-serif" font-size="3">Silicone sheet 1.2 mm (or printed TPU trial). No joint in ring.</text><text x="10" y="190" font-family="sans-serif" font-size="3">Board pads (purchased closed-cell silicone, shim after trial fit):</text><text x="10" y="197" font-family="sans-serif" font-size="3">4 rear pads: diameter 6 mm; 0.8 mm free, target 0.5 installed.</text><circle cx="12" cy="207" r="3" fill="none" stroke="black" stroke-width="0.15"/><circle cx="22" cy="207" r="3" fill="none" stroke="black" stroke-width="0.15"/><circle cx="32" cy="207" r="3" fill="none" stroke="black" stroke-width="0.15"/><circle cx="42" cy="207" r="3" fill="none" stroke="black" stroke-width="0.15"/><text x="10" y="219" font-family="sans-serif" font-size="3">4 front spacer strips: 4 x 0.7 mm; target 0.15 mm installed.</text><rect x="10" y="224" width="4" height="0.7" rx="0" fill="none" stroke="#000" stroke-width="0.15"/><rect x="20" y="224" width="4" height="0.7" rx="0" fill="none" stroke="#000" stroke-width="0.15"/><rect x="30" y="224" width="4" height="0.7" rx="0" fill="none" stroke="#000" stroke-width="0.15"/><rect x="40" y="224" width="4" height="0.7" rx="0" fill="none" stroke="#000" stroke-width="0.15"/><text x="10" y="239" font-family="sans-serif" font-size="3">Front pads sit on film bond land at x=-29 / +24, y=+-24.6.</text><text x="10" y="246" font-family="sans-serif" font-size="3">Check touch and glass pressure before sealing. Do not print an opaque window.</text><path d="M10 264 H60 M10 261 V267 M60 261 V267" fill="none" stroke="black" stroke-width="0.3"/><text x="23" y="273" font-family="sans-serif" font-size="3">50 mm</text></svg>